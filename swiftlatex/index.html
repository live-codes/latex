<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SwiftLaTeX in the Browser — LiveCodes POC</title>
    <style>
      :root {
        --bg: #0f1115;
        --panel: #161a22;
        --panel-2: #1b2029;
        --border: #2a2f3a;
        --text: #e6e8ec;
        --muted: #9aa4b2;
        --accent: #7c5cff;
        --ok: #3ecf8e;
        --err: #ff6b6b;
        --warn: #f0b429;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }

      header {
        display: flex;
        align-items: baseline;
        gap: 12px;
        padding: 14px 18px;
        border-bottom: 1px solid var(--border);
        background: var(--panel);
      }

      header h1 {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
      }

      header .sub {
        color: var(--muted);
        font-size: 13px;
      }

      header .badge {
        margin-left: auto;
        padding: 2px 8px;
        border: 1px solid var(--border);
        border-radius: 999px;
        color: var(--muted);
        font-size: 12px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      header a {
        color: var(--muted);
        font-size: 13px;
      }

      .toolbar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 18px;
        border-bottom: 1px solid var(--border);
        background: var(--panel);
      }

      button {
        padding: 7px 14px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--panel-2);
        color: var(--text);
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
      }

      button:hover:not(:disabled) {
        border-color: var(--accent);
      }

      button.primary {
        border-color: transparent;
        background: var(--accent);
        color: #fff;
      }

      button:disabled {
        opacity: 0.5;
        cursor: default;
      }

      .endpoint {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-left: 6px;
        color: var(--muted);
        font-size: 12px;
      }

      .endpoint input {
        width: 260px;
        padding: 6px 8px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--panel-2);
        color: var(--text);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 12px;
      }

      .status {
        margin-left: auto;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-size: 13px;
      }

      .status::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--muted);
      }

      .status.busy::before {
        background: var(--accent);
        animation: pulse 1s ease-in-out infinite;
      }

      .status.ok::before {
        background: var(--ok);
      }

      .status.error::before {
        background: var(--err);
      }

      .status.warn::before {
        background: var(--warn);
      }

      @keyframes pulse {
        50% {
          opacity: 0.25;
        }
      }

      main {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      .editor {
        min-height: 0;
        display: flex;
        border-right: 1px solid var(--border);
      }

      #source {
        flex: 1;
        width: 100%;
        min-height: 0;
        padding: 16px;
        border: 0;
        outline: none;
        resize: none;
        background: var(--panel);
        color: var(--text);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 14px;
        line-height: 1.6;
        tab-size: 2;
      }

      .preview {
        position: relative;
        min-height: 0;
        padding: 24px;
        background: var(--bg);
      }

      #document {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        border-radius: 4px;
        background: #fff;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      }

      .panel {
        position: absolute;
        inset: 24px;
        overflow: auto;
        padding: 14px 16px;
        border-radius: 8px;
        white-space: pre-wrap;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 13px;
        line-height: 1.5;
      }

      #error {
        border: 1px solid rgba(255, 107, 107, 0.5);
        background: #1a1113;
        color: #ffc9c9;
      }

      #log {
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--muted);
      }

      @media (max-width: 800px) {
        main {
          grid-template-columns: 1fr;
          grid-template-rows: 1fr 1fr;
        }

        .editor {
          border-right: 0;
          border-bottom: 1px solid var(--border);
        }

        .endpoint {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>SwiftLaTeX in the Browser</h1>
      <span class="sub">proof of concept — real pdfTeX compiled to WebAssembly → PDF</span>
      <a href="../">LaTeX.js demo →</a>
      <span class="badge">swiftlatexpdftex.wasm</span>
    </header>

    <div class="toolbar">
      <button id="run" class="primary" disabled>Run</button>
      <button id="download" disabled>Download PDF</button>
      <button id="logButton" disabled>Log</button>
      <label class="endpoint">
        TeX Live server
        <input id="endpoint" spellcheck="false" value="https://texlive2.swiftlatex.com/" />
      </label>
      <span id="status" class="status">Loading engine…</span>
    </div>

    <main>
      <section class="editor">
        <textarea id="source" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
      </section>
      <section class="preview">
        <iframe id="document" title="Compiled PDF"></iframe>
        <div id="log" class="panel" hidden></div>
        <div id="error" class="panel" hidden></div>
      </section>
    </main>

    <script src="PdfTeXEngine.js"></script>
    <script type="module">
      // POC: run the real pdfTeX engine in the browser. SwiftLaTeX compiles pdfTeX to
      // WebAssembly, so LaTeX source typed here becomes a genuine PDF in this tab.
      //
      // Two pieces ship with this page: the engine (PdfTeXEngine.js + swiftlatexpdftex.js +
      // swiftlatexpdftex.wasm), and — separately — the TeX Live files it needs at run time.
      // The engine fetches missing packages on demand from a TeX Live server, so that
      // server has to be reachable for a document to compile. It is configurable below.
      const { PdfTeXEngine } = window.exports;

      const DEFAULT_ENDPOINT = "https://texlive2.swiftlatex.com/";
      // The engine's first request for any document is its own preloaded format, at
      // <endpoint>pdftex/10/swiftlatexpdftex.fmt ("10" is pdfTeX's kpse code for a format).
      // Probing exactly that is the cheapest honest reachability test for a TeX Live server.
      const ENDPOINT_PROBE = "pdftex/10/swiftlatexpdftex.fmt";
      const PROBE_TIMEOUT_MS = 8000;

      const DEFAULT_SOURCE = `\\documentclass{article}

\\title{LaTeX in the Browser}
\\author{SwiftLaTeX \\\\ proof of concept for LiveCodes}
\\date{}

\\begin{document}
\\maketitle

\\section{Introduction}
This PDF was produced by \\textbf{pdfTeX} compiled to WebAssembly, running in your
browser. Nothing is uploaded and there is no compile server --- the engine itself
runs in this tab.

\\section{Mathematics}
Inline math such as $E = mc^2$ flows with the text, and displayed equations are
numbered:

\\begin{equation}
  \\label{eq:series}
  \\sum_{k=1}^{n} k = \\frac{n(n+1)}{2}
\\end{equation}

Equation~\\ref{eq:series} is the arithmetic series.

\\section{A table}
\\begin{tabular}{l r}
  \\hline
  Engine & Runs in the browser \\\\
  \\hline
  pdfTeX & yes \\\\
  XeTeX  & yes \\\\
  \\hline
\\end{tabular}

\\section{Lists}
\\begin{itemize}
  \\item Real TeX Live packages, fetched on demand
  \\item A genuine PDF, not HTML
  \\item No install, no upload
\\end{itemize}

\\end{document}
`;

      const source = document.getElementById("source");
      const frame = document.getElementById("document");
      const errorBox = document.getElementById("error");
      const logBox = document.getElementById("log");
      const statusEl = document.getElementById("status");
      const runButton = document.getElementById("run");
      const downloadButton = document.getElementById("download");
      const logButton = document.getElementById("logButton");
      const endpointInput = document.getElementById("endpoint");

      source.value = DEFAULT_SOURCE;

      let engine;
      let pdfUrl = "";
      let lastLog = "";

      const setStatus = (text, state = "") => {
        statusEl.textContent = text;
        statusEl.className = `status ${state}`.trim();
        document.documentElement.dataset.status = state || "idle";
        document.documentElement.dataset.state = text;
      };

      const show = (el, text) => {
        el.textContent = text;
        el.hidden = false;
      };

      const hidePanels = () => {
        errorBox.hidden = true;
        logBox.hidden = true;
      };

      const normalizeEndpoint = (url) => (url.endsWith("/") ? url : `${url}/`);

      const initEngine = async () => {
        runButton.disabled = true;
        downloadButton.disabled = true;
        logButton.disabled = true;
        setStatus("Loading engine (~1.8 MB)…", "busy");
        hidePanels();

        const endpoint = normalizeEndpoint(endpointInput.value.trim() || DEFAULT_ENDPOINT);

        engine = new PdfTeXEngine();
        try {
          await engine.loadEngine();
        } catch (err) {
          setStatus("Engine failed to load", "error");
          show(errorBox, `Could not start the pdfTeX worker: ${err && err.message ? err.message : err}`);
          return;
        }

        // Point the running worker at the chosen TeX Live server. The engine's own
        // setTexliveEndpoint() posts the change and then drops its worker handle, which
        // would leave it unable to compile — so talk to the live worker directly.
        if (endpoint !== DEFAULT_ENDPOINT && engine.latexWorker) {
          engine.latexWorker.postMessage({ cmd: "settexliveurl", url: endpoint });
        }

        hidePanels();
        runButton.disabled = false;
        logButton.disabled = false;
        setStatus(`Engine ready — TeX Live files from ${new URL(endpoint).host}`, "ok");
        document.documentElement.dataset.engine = "ready";
      };

      // The engine's own package requests use a 150 s timeout, so probe the server first
      // and fail fast with something actionable instead of appearing to hang.
      const checkEndpoint = async (endpoint) => {
        const url = endpoint + ENDPOINT_PROBE;
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), PROBE_TIMEOUT_MS);
        try {
          const res = await fetch(url, { signal: controller.signal, headers: { Range: "bytes=0-0" } });
          return { ok: res.ok || res.status === 206, status: res.status, url };
        } catch (err) {
          return { ok: false, status: err.name, url };
        } finally {
          clearTimeout(timer);
        }
      };

      const compile = async () => {
        if (!engine || !engine.isReady()) return;

        runButton.disabled = true;
        const endpoint = normalizeEndpoint(endpointInput.value.trim() || DEFAULT_ENDPOINT);

        setStatus("Checking TeX Live server…", "busy");
        const probe = await checkEndpoint(endpoint);
        if (!probe.ok) {
          runButton.disabled = false;
          setStatus("TeX Live server unreachable", "error");
          show(
            errorBox,
            [
              `TeX Live server unreachable (${probe.status}).`,
              "",
              `Probed: ${probe.url}`,
              "",
              "The pdfTeX engine runs entirely in this tab, but it fetches LaTeX's own",
              "files — the format (swiftlatexpdftex.fmt) and any packages — from a TeX Live",
              "file server on demand, and this one is not answering. Point the field above at",
              "a working server, or self-host one with SwiftLaTeX/Texlive-Ondemand.",
              "",
              "The engine itself is loaded and ready; only the files it needs are missing.",
            ].join("\n"),
          );
          return;
        }

        setStatus("Compiling… (first run downloads TeX Live files)", "busy");
        engine.flushCache();
        engine.writeMemFSFile("main.tex", source.value);
        engine.setEngineMainFile("main.tex");

        const started = performance.now();
        const result = await engine.compileLaTeX();
        const elapsed = Math.round(performance.now() - started);
        lastLog = result.log || "No log";

        runButton.disabled = false;
        logButton.disabled = false;

        if (result.pdf && result.pdf.length) {
          if (pdfUrl) URL.revokeObjectURL(pdfUrl);
          pdfUrl = URL.createObjectURL(new Blob([result.pdf], { type: "application/pdf" }));
          frame.src = pdfUrl;
          frame.hidden = false;
          logBox.hidden = true;
          errorBox.hidden = true;
          downloadButton.disabled = false;
          setStatus(`Compiled in ${elapsed} ms — PDF ${formatBytes(result.pdf.length)}`, "ok");
          document.documentElement.dataset.pdfBytes = String(result.pdf.length);
        } else {
          setStatus(`Compilation failed (status ${result.status})`, "error");
          show(errorBox, lastLog.trim() || "Compilation failed with no log.");
          document.documentElement.dataset.pdfBytes = "0";
        }
      };

      const formatBytes = (n) => (n < 1024 ? `${n} B` : `${(n / 1024).toFixed(0)} KB`);

      runButton.addEventListener("click", compile);
      downloadButton.addEventListener("click", () => {
        const link = document.createElement("a");
        link.href = pdfUrl;
        link.download = "document.pdf";
        link.click();
      });
      logButton.addEventListener("click", () => {
        const visible = !logBox.hidden;
        if (visible) {
          logBox.hidden = true;
        } else {
          show(logBox, lastLog.trim() || "No log yet.");
        }
      });
      endpointInput.addEventListener("change", initEngine);

      source.addEventListener("keydown", (event) => {
        if (event.key === "Tab") {
          event.preventDefault();
          const { selectionStart: start, selectionEnd: end, value } = source;
          source.value = `${value.slice(0, start)}  ${value.slice(end)}`;
          source.selectionStart = source.selectionEnd = start + 2;
        }
        if (event.key === "Enter" && (event.metaKey || event.ctrlKey)) {
          event.preventDefault();
          compile();
        }
      });

      await initEngine();
    </script>
  </body>
</html>
